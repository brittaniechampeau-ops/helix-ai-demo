:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);

  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);

  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:

    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {

  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {

}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,

    min-height: 44px;
  }

  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {

  ) {

  .form-check {

    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;

  }

  .form-range {

  }

    height: 44px;
  }

    height: 44px;
  }

  .form-range::-webkit-slider-thumb {

  }
}

svg {

    #uni-workshop{font-family:Arial,Helvetica,sans-serif;color:#f7f9fc;background:radial-gradient(circle at 82% 8%,rgba(0,214,235,.27),transparent 32%),#061226;border-radius:18px;overflow:hidden;min-height:640px}#uni-workshop *{box-sizing:border-box}#uni-workshop .bar{height:6px;background:#00d5ea}#uni-workshop .wrap{padding:34px 42px 38px;max-width:1000px;margin:auto}#uni-workshop .eyebrow{font-size:12px;letter-spacing:3px;color:#05d7ed;font-weight:700}#uni-workshop h1{font-size:38px;line-height:1.03;margin:18px 0 10px;max-width:760px}#uni-workshop .sub{color:#b6c3d9;font-size:17px;line-height:1.45;max-width:800px}#uni-workshop .step{display:none;margin-top:28px}#uni-workshop .step.active{display:block}#uni-workshop h2{font-size:27px;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid #29455e;background:rgba(7,25,48,.7);padding:16px;border-radius:8px}.card h3{color:#00d5ea;font-size:17px;margin:0 0 7px}.card p{margin:0;color:#d7dfec;line-height:1.4;font-size:15px}.choice{display:flex;align-items:flex-start;gap:10px;cursor:pointer}.choice input{accent-color:#00d5ea;margin-top:4px}.question{border-left:3px solid #00d5ea;padding:13px 16px;background:rgba(0,213,234,.07);margin:12px 0;color:#eef4fb;font-size:17px;line-height:1.4}.field{margin:14px 0}.field label{display:block;font-size:13px;letter-spacing:.8px;color:#8fa4c0;margin-bottom:6px;text-transform:uppercase}.field textarea{width:100%;min-height:70px;background:#0b1d35;border:1px solid #38546f;border-radius:6px;color:white;padding:10px;font:15px Arial;resize:vertical}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;border-top:1px solid #29455e;padding-top:18px}.nav button{background:#00d5ea;color:#041326;border:0;border-radius:4px;font-weight:700;padding:10px 17px;cursor:pointer}.nav button.secondary{background:transparent;border:1px solid #54718c;color:#d9e4f3}.progress{font-size:13px;color:#8fa4c0}.summary{background   &lt;div class=&quot;bar&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;PRIVATE FACILITATOR NOTES · BRITT BOWMAN LLC&lt;/div&gt;
    &lt;h1&gt;Lee working session&lt;/h1&gt;
    &lt;p class=&quot;sub&quot;&gt;Keep this private. Use it as your script and click through it as you go. Share your screen only on the final decision record.&lt;/p&gt;
    &lt;section class=&quot;step active&quot; data-step=&quot;1&quot;&gt;&lt;h2&gt;Start here&lt;/h2&gt;&lt;div class=&quot;question&quot;&gt;I want to be direct with you about what I think, and then we can work through it together.&lt;/div&gt;&lt;div class=&quot;summary&quot;&gt;&lt;h3&gt;Say this&lt;/h3&gt;&lt;p&gt;I went through everything you sent me. I understand the company you’re trying to build, and I don’t think this is a generic hiring-assessment business. The larger idea is an independent evidence and trust layer for consequential workforce decisions. That’s the interesting part.&lt;/p&gt;&lt;p&gt;But I think we’ve been talking past each other a little. I came into this trying to help you identify a credible first commercial wedge and get market proof. You’re telling me the primary goal is to raise capital and build toward a strategic outcome.&lt;/p&gt;&lt;p&gt;I don’t think those are competing paths. If you want capital, you still need evidence that someone outside UNI believes in this enough to put something at risk. Customers, design partners, institutional partners, investors, a team. Research helps establish the category, but it doesn’t replace that proof.&lt;/p&gt;&lt;p&gt;I can’t tell you whether Microsoft or Workday will buy UNI, and I don’t think anybody can responsibly tell you that today. What we can do is get clear about what UNI would need to build for that question to make sense. What would they actually be buying? A team? Customers? Validation evidence? A credential network? A product people rely on? Something they can’t just build later?&lt;/p&gt;&lt;p&gt;I want us to leave with a real answer on the route you’re choosing, what it needs to prove, and what has to happen next. I’m not trying to make the company smaller. I’m trying to make the plan real.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;What Lee says the actual conversation needs to be&lt;/label&gt;&lt;textarea data-key=&quot;leeFraming&quot; placeholder=&quot;Capture his response in his words.&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;/section&gt;
    &lt;section class=&quot;step&quot; data-step=&quot;2&quot;&gt;&lt;h2&gt;1. How are you trying to get there?&lt;/h2&gt;&lt;div class=&quot;question&quot;&gt;There are a few routes from idea to money. Which one are you actually choosing for the next year?&lt;/div&gt;&lt;div class=&quot;grid&quot;&gt;
      &lt;label class=&quot;card choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;route&quot; value=&quot;Customer-funded&quot;&gt;&lt;span&gt;&lt;h3&gt;Customer-funded&lt;/h3&gt;&lt;p&gt;Paying customers prove a repeatable commercial wedge.&lt;/p&gt;&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;card choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;route&quot; value=&quot;Pre-seed or angel-funded&quot;&gt;&lt;span&gt;&lt;h3&gt;Pre-seed or angel-funded&lt;/h3&gt;&lt;p&gt;Capital accelerates a credible team and a defined proof plan.&lt;/p&gt;&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;card choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;route&quot; value=&quot;Strategic-partner-led&quot;&gt;&lt;span&gt;&lt;h3&gt;Strategic-partner-led&lt;/h3&gt;&lt;p&gt;A serious institution or platform validates a real strategic gap.&lt;/p&gt;&lt;/span&gt;&lt;/label&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Acquisition&lt;/h3&gt;&lt;p&gt;Something that might happen after the company has built a team, customers, and an asset a buyer wants.&lt;/p&gt;&lt;/div&gt;
      &lt;label class=&quot;card choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;route&quot; value=&quot;Other / not yet clear&quot;&gt;&lt;span&gt;&lt;h3&gt;Other or not yet clear&lt;/h3&gt;&lt;p&gt;Use Lee’s own description. We don’t need to force a route before we understand what he means.&lt;/p&gt;&lt;/span&gt;&lt;/label&gt;
    &lt;/div&gt;&lt;div class=&quot;summary&quot;&gt;&lt;h3&gt;Ask him&lt;/h3&gt;&lt;p&gt;Which route is the actual plan for the next 12 months?&lt;/p&gt;&lt;p&gt;If you’re choosing capital-first, what are you raising, from whom, and what exact milestone does the money get you to?&lt;/p&gt;&lt;p&gt;What’s the second-best route if this one doesn’t materialize?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;How Lee describes the route in his own words&lt;/label&gt;&lt;textarea data-key=&quot;routeNarrative&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Why this route now?&lt;/label&gt;&lt;textarea data-key=&quot;whyRoute&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;/section&gt;
    &lt;section class=&quot;step&quot; data-step=&quot;3&quot;&gt;&lt;h2&gt;2. What would make someone else believe it?&lt;/h2&gt;&lt;div class=&quot;question&quot;&gt;We need something outside UNI that shows this isn’t just a good argument in a room.&lt;/div&gt;&lt;div class=&quot;summary&quot;&gt;&lt;h3&gt;Ask him&lt;/h3&gt;&lt;p&gt;Who’s on the team besides you, or who has to be formally committed for someone to believe this can be built?&lt;/p&gt;&lt;p&gt;What external proof exists today that isn’t your own research, product work, or conviction?&lt;/p&gt;&lt;p&gt;Who will put something at risk in the next 90 days: a customer, a design partner, an institutional collaborator, or an investor?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Who else needs to be part of the team or formally committed?&lt;/label&gt;&lt;textarea data-key=&quot;team&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Who will put something at risk?&lt;/label&gt;&lt;textarea data-key=&quot;proof&quot; placeholder=&quot;Customer, design partner, investor, institutional collaborator, or validation partner...&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;What would count as a real milestone in the next 12 months?&lt;/label&gt;&lt;textarea data-key=&quot;milestone&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;/section&gt;
    &lt;section class=&quot;step&quot; data-step=&quot;4&quot;&gt;&lt;h2&gt;3. What does the first proof actually look like?&lt;/h2&gt;&lt;div class=&quot;question&quot;&gt;I don’t think early customers automatically turn UNI into a hiring-assessment company. It depends on what they buy and what it proves.&lt;/div&gt;&lt;div class=&quot;summary&quot;&gt;&lt;h3&gt;Ask him&lt;/h3&gt;&lt;p&gt;What’s the first consequential workforce decision that demonstrates the bigger UNI + ETI idea?&lt;/p&gt;&lt;p&gt;What is the actual thing the customer receives, relies on, challenges, or carries forward?&lt;/p&gt;&lt;p&gt;How does that first customer prove this is an independent trust layer rather than another assessment product?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Which workforce decision do we start with?&lt;/label&gt;&lt;textarea data-key=&quot;decision&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Who can actually help prove it?&lt;/label&gt;&lt;textarea data-key=&quot;partner&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;What does UNI build that a big incumbent can’t easily copy?&lt;/label&gt;&lt;textarea data-key=&quot;asset&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;/section&gt;
    &lt;section class=&quot;step&quot; data-step=&quot;5&quot;&gt;&lt;h2&gt;4. What would a buyer actually be buying?&lt;/h2&gt;&lt;div class=&quot;question&quot;&gt;We can’t predict whether Microsoft or Workday will buy UNI. We can get clear about what they’d need to see for the question to make sense.&lt;/div&gt;&lt;div class=&quot;summary&quot;&gt;&lt;h3&gt;Ask him&lt;/h3&gt;&lt;p&gt;If Workday or Microsoft bought UNI in two years, what would they actually be buying?&lt;/p&gt;&lt;p&gt;Why would they buy it rather than build it or acquire it later for less?&lt;/p&gt;&lt;p&gt;Does selling to a platform undermine the independence that makes UNI valuable? If not, why not?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;The asset they would care about&lt;/label&gt;&lt;textarea data-key=&quot;strategicAsset&quot; placeholder=&quot;Team, customers, validation evidence, credential network, credibility, distribution...&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Why it’s worth buying instead of building&lt;/label&gt;&lt;textarea data-key=&quot;buildBuy&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;What would make us change the plan?&lt;/label&gt;&lt;textarea data-key=&quot;disproof&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;/section&gt;
    &lt;section class=&quot;step&quot; data-step=&quot;6&quot;&gt;&lt;h2&gt;5. Where did we land?&lt;/h2&gt;&lt;div class=&quot;question&quot;&gt;Now share your screen if you want to fill this in together.&lt;/div&gt;&lt;div class=&quot;summary&quot;&gt;&lt;h3&gt;What Lee said he is trying to do&lt;/h3&gt;&lt;p&gt;&lt;span data-out=&quot;leeFraming&quot;&gt;Not yet captured&lt;/span&gt;&lt;/p&gt;&lt;h3&gt;What we decided&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Route:&lt;/strong&gt; &lt;span data-out=&quot;route&quot;&gt;Not yet selected&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;In Lee’s words:&lt;/strong&gt; &lt;span data-out=&quot;routeNarrative&quot;&gt;Not yet captured&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;What we need to prove:&lt;/strong&gt; &lt;span data-out=&quot;milestone&quot;&gt;Not yet defined&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Who has to commit:&lt;/strong&gt; &lt;span data-out=&quot;proof&quot;&gt;Not yet defined&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Asset we need to build:&lt;/strong&gt; &lt;span data-out=&quot;asset&quot;&gt;Not yet defined&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;What we stop treating as urgent:&lt;/strong&gt; Anything that doesn’t help us prove the route we chose.&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;You can say: “I think the work now is to stop treating the exit as the plan. We need to build the company that could earn that outcome.”&lt;/p&gt;&lt;/section&gt;
    &lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;secondary&quot; id=&quot;back&quot; type=&quot;button&quot;&gt;Back&lt;/button&gt;&lt;span class=&quot;progress&quot;&gt;Step &lt;span id=&quot;stepno&quot;&gt;1&lt;/span&gt; of &lt;span id=&quot;steptotal&quot;&gt;6&lt;/span&gt;&lt;/span&gt;&lt;button id=&quot;next&quot; type=&quot;button&quot;&gt;Next&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
    (()=&gt;{const root=document.getElementById(&#x27;uni-workshop&#x27;),steps=[...root.querySelectorAll(&#x27;.step&#x27;)],out=[...root.querySelectorAll(&#x27;[data-out]&#x27;)];let n=0;const val=k=&gt;{if(k===&#x27;route&#x27;){const route=root.querySelector(&#x27;input[name=&quot;route&quot;]:checked&#x27;)?.value;if(route===&#x27;Other / not yet clear&#x27;)return root.querySelector(&#x27;[data-key=&quot;routeNarrative&quot;]&#x27;)?.value||route;return route||&#x27;Not yet selected&#x27;}const text=root.querySelector(`[data-key=&quot;${k}&quot;]`)?.value;return text||&#x27;Not yet captured&#x27;};function render(){steps.forEach((s,i)=&gt;s.classList.toggle(&#x27;active&#x27;,i===n));root.querySelector(&#x27;#stepno&#x27;).textContent=n+1;root.querySelector(&#x27;#steptotal&#x27;).textContent=steps.length;root.querySelector(&#x27;#back&#x27;).style.visibility=n?&#x27;visible&#x27;:&#x27;hidden&#x27;;root.querySelector(&#x27;#next&#x27;).textContent=n===steps.length-1?&#x27;Review decision&#x27;:&#x27;Next&#x27;;out.forEach(x=&gt;x.textContent=val(x.dataset.out));}root.querySelector(&#x27;#next&#x27;).onclick=()=&gt;{if(n&lt;steps.length-1)n++;render()};root.querySelector(&#x27;#back&#x27;).onclick=()=&gt;{if(n&gt;0)n--;render()};root.addEventListener(&#x27;input&#x27;,render);render()})()
